<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome - Blog Pahlawan Indonesia</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<script>
        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            const btn = document.getElementById('darkModeBtn');
            btn.textContent = document.body.classList.contains('dark-mode') ? '☀️ Light Mode' : '🌙 Dark Mode';
            localStorage.setItem('darkMode', document.body.classList.contains('dark-mode'));
        }

        // Load Dark Mode
        if (localStorage.getItem('darkMode') === 'true') {
            document.body.classList.add('dark-mode');
            document.getElementById('darkModeBtn').textContent = '☀️ Light Mode';
        }
    </script>
</body>
</html>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h2>🗽 Blog Pahlawan Indonesia</h2>
            <div class="nav-links">
                <a href="homepage.html">🏠 Beranda</a>
                <a href="profile.html">👤 Profil</a>
                <button onclick="toggleDarkMode()" id="darkModeBtn">🌙 Dark Mode</button>
            </div>
        </div>
    </nav>

    <main class="welcome-container">
        <div class="welcome-content">
            <h1>🇮🇩 Selamat Datang di Blog Pahlawan Indonesia</h1>
            <p>Mengenal perjuangan para pahlawan bangsa yang mengukir sejarah kemerdekaan kita.</p>
            <div class="cta-buttons">
                <a href="homepage.html" class="btn-primary">Mulai Jelajah</a>
                <a href="profile.html" class="btn-secondary">Tentang Saya</a>
            </div>
        </div>
        <div class="hero-image">
            <img src="pahlawan.jpeg" alt="Pahlawan Indonesia">
        </div>
    </main>
	
    <script src="js/script.js"></script>
</body>
</html>
